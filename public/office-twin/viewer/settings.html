<!doctype html><html lang="zh-CN" data-theme="light" data-astra-palette="astra" data-astra-scheme="light"><head><link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办公室设置 · Astra</title><link rel="stylesheet" href="../astra_ui/astra-ui.css"><link rel="stylesheet" href="./settings.css"></head><body class="studio">
<header class="settings-top"><div><strong>造价智算</strong><span class="badge badge-primary">办公室设置</span></div><a href="./index.html" class="btn btn-ghost" id="back-viewer">返回沙盘</a></header>
<main class="settings-main"><h1>让沙盘对应你的办公室</h1><p class="settings-muted">配置仅保存在本浏览器，不上传、不与团队共享。真实员工服务、任务和复核后台尚未接入；初始6位同事及任务均为演示数据。清理浏览器数据或更换端口/浏览器可能丢失配置，请导出备份。</p>
<div id="settings-status" role="status" aria-live="polite">正在读取房间和工位…</div>
<form id="settings-form"><section class="card settings-card"><h2>办公室名称</h2><label for="office-name">沙盘标题与办公室显示名</label><input class="input input-bordered" id="office-name" maxlength="60" required></section>
<section class="card settings-card"><div class="section-heading"><h2>同事与工位</h2><button id="add-person" class="btn btn-ghost" type="button" disabled>新增同事</button></div><p class="settings-muted">先选择房间，再选择现有工位。一张工位只对应一位同事；模型位置及PersonAnchor节点不会改动。</p><div id="people-editors"></div></section>
<section class="card settings-card"><details><summary>房间显示名称（<span id="room-count">20</span>个）</summary><p class="settings-muted">只修改显示名称，保留房间ID及图纸布局。</p><div id="room-editors" class="room-grid"></div></details></section>
<footer class="settings-actions"><button type="submit" id="save-settings" class="btn btn-primary" disabled>保存设置</button><button type="button" id="export-settings" class="btn btn-ghost" disabled>导出配置</button><label class="btn btn-ghost" for="import-settings">导入配置</label><input id="import-settings" type="file" accept="application/json,.json" hidden disabled><button type="button" id="reset-settings" class="btn btn-ghost" disabled>恢复演示默认值</button></footer></form>
<p class="settings-muted">保存后，返回沙盘将读取最新名称和工位绑定。同事ID仅用于本地演示，不能当成Astra真实员工标识。</p></main><script type="module" src="./settings.js"></script></body></html>
