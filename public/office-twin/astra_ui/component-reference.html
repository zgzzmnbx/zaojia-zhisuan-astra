<!doctype html>
<html lang="zh-CN" data-theme="light" data-astra-palette="astra" data-astra-scheme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Astra 原样式组件核对</title><link rel="stylesheet" href="./astra-ui.css"><style>
/* Reference-only positioning; controls retain their unchanged upstream styles. */
html,body{min-height:100%;height:auto}#shell{padding:24px;max-width:1100px;margin:auto}.reference-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:16px 0}.reference-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.reference-grid>.rw-window.rw-inline{height:460px}.reference-readout{white-space:pre-wrap;overflow-wrap:anywhere;font-size:var(--dws-font-size-12);color:var(--astra-muted)}.reference-people{margin-top:16px}.reference-text{line-height:1.8;margin:16px 0!important}
</style></head>
<body class="studio"><main id="shell" class="live-shell">
<header class="topbar four-surface-topbar"><div class="studio-identity"><strong class="studio-brand">造价智算</strong><div class="topbar-page"><span>Astra 原样式组件核对</span></div></div><div class="top-actions"><button class="btn btn-ghost btn-square" data-theme-toggle aria-label="切换明暗"><span class="astra-icon" data-icon="moon"></span></button></div></header>
<p class="reference-text">本页用于检查办公室查看器将复用的主题、按钮、输入、人员列表和复核窗口。字体文件缺项见字体说明。</p>
<div class="reference-row"><button id="primary-check" class="btn btn-primary"><span class="astra-icon" data-icon="buildings"></span>整栋建筑</button><button class="btn btn-outline"><span class="astra-icon" data-icon="stack"></span>拆层查看</button><button class="btn btn-ghost">返回9楼</button><button class="btn btn-primary" disabled>未绑定任务</button><span class="badge badge-ghost">空间预览</span><select id="palette" class="select select-sm" aria-label="主题"><option value="astra">Astra 蓝</option><option value="mantine-blue">Mantine 蓝</option><option value="emerald">翡翠绿</option><option value="nord">北境蓝</option><option value="silk">丝绒紫</option><option value="autumn">秋日铜</option><option value="graphite">石墨灰</option></select></div>
<div class="reference-grid"><section class="rw-window rw-inline"><header class="rw-header"><span class="rw-heading-icon astra-icon" data-icon="users-three"></span><div><strong>协同复核</strong><small>原组件样式</small></div><div class="rw-window-actions"><button class="btn btn-ghost btn-square" aria-label="刷新"><span class="astra-icon" data-icon="refresh"></span></button></div></header><nav class="rw-tabs"><div class="join"><button class="btn btn-sm join-item btn-primary">办公室</button><button class="btn btn-sm join-item btn-ghost">流程</button></div></nav><div class="rw-inspector"><fieldset class="rw-fields"><legend>本次选择</legend><label>搜索工位<input class="input" placeholder="房间或工位编号"></label><div class="rw-people"><label class="is-selected"><span class="rw-avatar">A</span><strong>工位 A-01</strong><input type="checkbox" checked></label><label><span class="rw-avatar">A</span><strong>工位 A-02</strong><input type="checkbox"></label></div></fieldset></div><footer class="rw-footer"><span>组件核对页，不连接业务服务</span><button class="btn btn-primary btn-sm">查看详情</button></footer></section>
<section class="rw-window rw-inline"><header class="rw-header"><span class="rw-heading-icon astra-icon" data-icon="info"></span><div><strong>来源与状态</strong></div></header><div class="rw-inspector"><div class="rw-artifact"><span class="astra-icon" data-icon="stack"></span><span>Astra 原始 CSS + 原始 Phosphor SVG</span></div><p class="reference-text">源提交：0fdbe5d3fbea72b371afe089b88037f1c9966238。默认亮色、Astra 蓝。所有色值和组件规则来自该提交。</p><pre id="readout" class="reference-readout"></pre></div></section></div>
<script type="module">
import {paintIcons} from './icons.js';
import {applyAstraTheme} from './theme.js';
paintIcons();let scheme='light';
function report(){const root=getComputedStyle(document.documentElement),b=getComputedStyle(document.querySelector('#primary-check'));const data={palette:document.documentElement.dataset.astraPalette,scheme:document.documentElement.dataset.astraScheme,paper:root.getPropertyValue('--astra-paper').trim(),primary:root.getPropertyValue('--astra-primary').trim(),buttonBackground:b.backgroundColor,buttonColor:b.color,buttonHeight:b.height,buttonFontSize:b.fontSize,fontStack:getComputedStyle(document.body).fontFamily,iconCount:document.querySelectorAll('svg[data-phosphor]').length};document.querySelector('#readout').textContent=JSON.stringify(data,null,2);document.documentElement.dataset.styleCheck='ready';}
document.querySelector('#palette').addEventListener('change',e=>{applyAstraTheme({palette:e.target.value,scheme});report()});document.querySelector('[data-theme-toggle]').addEventListener('click',()=>{scheme=scheme==='light'?'dark':'light';applyAstraTheme({palette:document.querySelector('#palette').value,scheme});report()});requestAnimationFrame(report);
</script></main></body></html>
