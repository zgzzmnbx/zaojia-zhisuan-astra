<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>造价智算 · 白模空间</title></head>
<body>
<main id="app">
  <div id="scene" aria-label="可旋转和选择建筑的三维白模沙盘"></div>
  <div id="loading" role="status"><span class="loading loading-spinner loading-sm"></span><span>正在打开项目空间</span></div>
  <header class="top-left"><div class="brand"><span class="brand-mark" data-icon="stack"></span><strong>造价智算</strong></div><span class="separator"></span><span class="space-name">项目空间</span><span class="concept">交互样机</span></header>
  <nav class="top-right float-panel" aria-label="空间控制"><label class="shadow-control" for="signal-flow"><span>信息流</span><input type="checkbox" class="toggle toggle-primary toggle-sm" id="signal-flow" role="switch" checked></label><span class="separator"></span><label class="shadow-control" for="scene-shadows"><i data-icon="sun"></i><span>场景阴影</span><input type="checkbox" class="toggle toggle-primary toggle-sm" id="scene-shadows" role="switch" checked></label><span class="separator"></span><button class="btn btn-ghost" id="all-toggle" aria-expanded="false"><i data-icon="squares-four"></i>全部功能</button><button class="btn btn-ghost btn-square" id="home" title="返回全景" aria-label="返回全景"><i data-icon="house"></i></button></nav>
  <section id="all-menu" class="card float-panel" aria-label="全部功能" hidden></section>
  <div id="hotspots" aria-label="场景功能入口"></div>
  <aside id="chat" class="card float-panel chat-window" aria-label="与智算对话">
    <header class="panel-header"><div class="chat-heading"><span class="chat-avatar">Z</span><span>ZSuan</span></div><div class="panel-actions"><button class="btn btn-ghost btn-square btn-sm" id="chat-collapse" aria-label="收起聊天" title="收起聊天"><i data-icon="caret-down"></i></button></div></header>
    <div id="messages" class="messages" aria-live="polite"><div class="message assistant"><span class="speaker">智算</span><p>从沙盘中选择一项功能，或直接告诉我你要做什么。</p></div><div class="message user"><p>我想检查清单里的风险。</p></div><div class="message assistant"><span class="speaker">智算</span><p>点击跨河管道，进入风险复核。</p><button class="btn btn-sm message-action" data-route="risk"><i data-icon="crosshair"></i>定位风险复核</button></div></div>
    <form id="chat-form" class="composer"><label class="sr-only" for="draft">向智算提问</label><textarea id="draft" placeholder="向智算提问…" rows="2"></textarea><div class="composer-bottom"><span>本地交互演示</span><button class="btn btn-primary btn-square btn-sm" type="submit" aria-label="发送消息"><i data-icon="arrow-up"></i></button></div></form>
  </aside>
  <button class="btn float-panel chat-reopen" id="chat-open" aria-label="展开聊天" hidden><span class="chat-avatar">Z</span><span>与智算对话</span><i data-icon="chat-circle-text"></i></button>
  <section class="card float-panel inspector" id="inspector" aria-label="功能预览" hidden><header class="panel-header"><div><span class="eyebrow" id="zone-number"></span><h1 id="zone-title"></h1></div><button class="btn btn-ghost btn-square btn-sm" id="close-inspector" aria-label="关闭功能并返回全景"><i data-icon="x"></i></button></header><div id="inspector-body"></div></section>
  <div class="bottom-left"><span class="state-dot"></span><span id="view-label">空间全景</span><span class="dot-divider">/</span><span>信息流示意</span></div>
  <nav class="bottom-controls float-panel" aria-label="镜头控制"><button id="orbit" class="btn btn-ghost btn-sm" aria-pressed="false"><i data-icon="play"></i><span>环游</span></button><span class="separator"></span><button id="zoom-in" class="btn btn-ghost btn-square btn-sm" aria-label="放大"><i data-icon="plus"></i></button><button id="zoom-out" class="btn btn-ghost btn-square btn-sm" aria-label="缩小"><i data-icon="caret-down"></i></button><button id="reset" class="btn btn-ghost btn-square btn-sm" aria-label="重置视角"><i data-icon="arrow-counter-clockwise"></i></button><span class="separator"></span><span class="drag-hint">拖动旋转 · 滚轮缩放</span></nav>
  <div class="bottom-right"><kbd>ESC</kbd><span>返回全景</span></div>
  <div id="toast" class="float-panel" role="status" hidden></div>
</main><script type="module" src="./main.js"></script></body></html>
