<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>白模城市 · 染色动效研究</title></head><body>
<div id="scene"></div><header><span class="eyebrow">ASTRA / MATERIAL STUDY 02</span><h1>让完成，看得见。</h1><p>白模城市 · 染色动效示例</p></header>
<aside class="glass"><span class="eyebrow">完成色 · 局部雾蓝</span><h2>白色骨架，雾蓝立面</h2><div class="swatches"><i style="background:#93c7e6"></i><i style="background:#a4c9ce"></i><i style="background:#b6c5dc"></i><span>统一雾蓝 · 白色留边</span></div><p>重点立面自下而上显色，蓝色推进带随完成淡出。屋顶、楼板、底座与管线保留白色。</p><label>染色方式<select id="paint-style"><option value="focused">新版 · 局部雾蓝</option><option value="soft">原版 · 薄层淡彩</option></select></label><label>建筑<select id="building"></select></label><label>染色浓度 <output id="strength-value">76%</output><input id="strength" aria-label="染色浓度" type="range" min="15" max="100" value="76"></label><div class="legend"><span><i></i>待开始 · 白模</span><span><i></i>工作中 · 自下而上</span><span><i></i>已完成 · 雾蓝留存</span></div></aside>
<div id="label" class="glass"><span id="node-title">知识检索</span><strong id="node-status">等待演示</strong></div><div id="loading">正在载入原沙盘模型…</div>
<footer class="glass"><div class="actions"><button id="before">原始白模</button><button id="single" class="primary">播放单楼染色</button><button id="city">播放全城流程</button><button id="after">全城完成</button><button id="home">全景</button></div><div class="scrub"><button id="pause" disabled>暂停</button><span id="phase">染色前</span><input id="progress" aria-label="演示进度" type="range" min="0" max="1000" value="0"><output id="percent">0%</output></div></footer>
<div class="footnote">独立视觉示例 · 合成进度，不执行任务 · 拖动旋转 / 滚轮缩放</div><script type="module" src="./main.js"></script></body></html>
