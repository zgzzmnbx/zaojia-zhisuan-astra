<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><link rel="icon" href="data:,"><title>造价智算 · 沙盘光影样板</title></head><body>
<header><div class="identity"><strong>沙盘光影样板</strong><span class="badge badge-ghost">独立测试</span></div><nav aria-label="镜头"><button class="btn btn-sm active" data-view="overview" aria-pressed="true">全景</button><button class="btn btn-sm" data-view="tanks" aria-pressed="false">储罐近景</button><button class="btn btn-sm" data-view="pipes" aria-pressed="false">管道近景</button></nav><div class="actions"><button id="reference" class="btn btn-sm" aria-pressed="false">Blender 参考图</button><button id="settings" class="btn btn-sm" aria-expanded="false" aria-controls="controls">效果设置</button></div></header>
<main id="stage" aria-label="可旋转缩放的三维沙盘"><div id="loading" role="status"><span class="loading loading-spinner"></span><span>正在载入沙盘与光影…</span></div><img id="reference-image" alt="同机位 Blender 静态参考渲染" hidden><span id="reference-label" hidden>Blender 参考图 · 静态</span><aside id="controls" class="card" hidden><label>烘焙光影<input id="baked" type="checkbox" class="toggle toggle-sm" checked></label><label>金属反射<input id="reflection" type="checkbox" class="toggle toggle-sm" checked></label><label>自动环游<input id="orbit" type="checkbox" class="toggle toggle-sm"></label><label class="slider-label" for="exposure">亮度 <output id="exposure-value">1.00</output></label><input id="exposure" class="range range-xs" type="range" min="0.6" max="1.6" step="0.02" value="1"><button id="reset" class="btn btn-sm">恢复样板设置</button></aside><footer><span id="hint">拖动旋转 · 滚轮缩放</span><span id="state" role="status">准备中</span></footer></main><script type="module" src="/main.js"></script></body></html>
