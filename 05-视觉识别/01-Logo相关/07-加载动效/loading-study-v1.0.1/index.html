<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>造价智算 · Logo 加载动效</title><style>/*STYLE*/</style></head>
<body><main>
<header class="page-header"><h1>Logo 加载动效</h1><div class="tools"><label>Logo 配色 <select id="palette" class="select select-sm" aria-label="Logo 配色"></select></label><button id="theme" class="btn btn-outline btn-sm">切换深色</button></div></header>
<div class="comparison">
<section class="study" data-speed="1"><header><h2>原版波浪</h2><span class="badge badge-outline">1 倍速 · 8 秒</span></header>
<div class="stage" role="img" aria-label="原版波浪动效"><div class="canvas-host"></div><span class="fallback" hidden>Z</span></div>
<div class="loading-status"><span class="status-text" role="status">原版波浪</span></div><p class="description">保持原来的舒展节奏。</p>
<div class="actions"><button class="btn btn-ghost pause">暂停</button><button class="btn btn-ghost replay">重播</button></div></section>
<section class="study" data-speed="2"><header><h2>波浪加载</h2><span class="badge badge-outline">3.4 秒一轮</span></header>
<div class="stage" role="img" aria-label="快速拆开、波浪起伏、组合归位循环"><div class="canvas-host"></div><span class="fallback" hidden>Z</span></div>
<div class="loading-status"><span class="status-dot"></span><span class="status-text" role="status">正在加载，请稍候…</span></div><p class="description">快速拆开，波浪起伏，再组合归位。合并后静止 0.5 秒，约 3.4 秒一轮。</p>
<div class="actions"><button class="btn btn-primary finish">模拟完成</button><button class="btn btn-ghost pause">暂停</button><button class="btn btn-ghost replay">重播</button></div></section>
<section class="study" data-speed="2" data-motion="ring"><header><h2>圆环加载</h2><span class="badge badge-outline">3.6 秒一轮</span></header>
<div class="stage" role="img" aria-label="完整 Z 分开成圆环、缓转一圈、缓慢合并回 Z 循环"><div class="canvas-host"></div><span class="fallback" hidden>Z</span></div>
<div class="loading-status"><span class="status-dot"></span><span class="status-text" role="status">正在加载，请稍候…</span></div><p class="description">从完整 Z 开始，分开成环、缓转一圈，再缓慢合并回 Z。</p>
<div class="actions"><button class="btn btn-primary finish">模拟完成</button><button class="btn btn-ghost pause">暂停</button><button class="btn btn-ghost replay">重播</button></div></section>
</div><footer><p>独立预览 · 默认原版蓝，可对照已有配色。</p><span>v1.1.2</span></footer>
<p id="motion-note" hidden>系统已开启减少动效，点击「播放」查看。</p>
</main><script>/*SCRIPT*/</script></body></html>
