<!doctype html>
<html lang="zh-CN" data-theme="light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>造价智算 · 阶梯 Z 三维预览</title>
<style>/*__DAISY__*/
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'PingFang SC','Microsoft YaHei UI',sans-serif}body{color:var(--ink);background:var(--surface)}
:root{--surface:#f8fafc;--ink:#092453;--muted:#5b687a;--line:#dce3eb;--color-primary:#176abd;--color-primary-content:#fff;--color-base-content:#092453;--color-base-100:#fff;--color-base-200:#edf2f8;--color-base-300:#dde5ee;--radius-field:.6rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0;--fx-noise:none}
:root[data-theme=dark]{color-scheme:dark;--surface:#0b1424;--ink:#eaf2ff;--muted:#9baac0;--line:#29364a;--color-base-content:#eaf2ff;--color-base-100:#0b1424;--color-base-200:#1c2b40;--color-base-300:#304057}
button,input{font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #3894ed;outline-offset:4px}.btn{font-size:13px}.btn-primary{color:#fff;background:linear-gradient(135deg,#247fd4,#145fae)}
header{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px}header strong{font-size:16px}header span{font-size:12px;color:var(--muted);letter-spacing:.06em}
main{max-width:1440px;margin:auto;padding:0 40px 28px}.hero{position:relative;text-align:center}#stage{height:clamp(340px,62vh,650px);position:relative;cursor:grab}#stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%;touch-action:none}.wordmark{margin-top:-10px;pointer-events:none}.wordmark h1{font-size:28px;letter-spacing:.15em;margin:0 0 8px;font-weight:700}.wordmark p{font-size:14px;letter-spacing:.45em;margin:0;padding-left:.45em;color:var(--muted)}
.hint{margin:22px 0 28px;font-size:12px;color:var(--muted)}.toolbar{border-top:1px solid var(--line);padding-top:24px;display:flex;justify-content:space-between;gap:20px;align-items:center;flex-wrap:wrap}.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.light{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);margin-left:12px}.light input{width:100px;accent-color:#228be6}footer{display:flex;justify-content:space-between;margin-top:20px;gap:16px;font-size:12px;color:var(--muted)}#status{min-height:18px}@media(max-height:760px){#stage{height:46vh}.hint{margin:16px 0}.toolbar{padding-top:16px}}@media(max-width:1000px){main{padding-inline:24px}header{padding-inline:24px}.toolbar{gap:12px}}
</style></head>
<body><header><strong>造价智算</strong><span>阶梯 Z · 原位翻转</span></header>
<main><section class="hero" aria-label="三维标志"><div id="stage"></div><div class="wordmark"><h1>造价智算</h1><p>ZSuan</p></div><p class="hint">拖动旋转 · 滚轮缩放 · 点击中间方块播放</p></section>
<section class="toolbar" aria-label="预览控制"><div class="group"><button id="play" class="btn btn-primary" aria-pressed="false">播放动效</button><button id="once" class="btn">旋转一次</button><button id="reset" class="btn btn-ghost">复位</button><button id="front" class="btn btn-ghost">正面</button></div><div class="group"><label class="light">光照<input id="light" type="range" min="-80" max="80" value="-30"></label><button id="theme" class="btn btn-ghost">深色背景</button><button id="download" class="btn btn-outline">下载 3D 模型</button></div></section>
<footer><span id="status" role="status" aria-live="polite">正在加载三维标志…</span><span>概念模型 v1.1.0</span></footer></main>
<script>/*__VIEWER__*/</script></body></html>
