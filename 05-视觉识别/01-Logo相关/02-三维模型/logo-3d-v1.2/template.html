<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>造价智算 · 模型与组装动效</title><style>
/*__DAISY__*/
:root{--surface:#f7f9fc;--ink:#122c4b;--muted:#64758b;--line:#dce5ef;--panel:#fff;--color-primary:#176abd;--color-primary-content:#fff;--color-base-content:#122c4b;--color-base-100:#fff;--color-base-200:#edf2f8;--color-base-300:#dde5ee;--radius-field:.6rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0;--fx-noise:none}
:root[data-theme=dark]{color-scheme:dark;--surface:#0b1424;--ink:#eaf2ff;--muted:#9baac0;--line:#29364a;--panel:#101e32;--color-base-content:#eaf2ff;--color-base-100:#0b1424;--color-base-200:#1c2b40;--color-base-300:#304057}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'PingFang SC','Microsoft YaHei UI',sans-serif}body{background:var(--surface);color:var(--ink)}button,input,select{font:inherit}.btn{font-size:13px}.btn-primary{color:#fff;background:linear-gradient(135deg,#247fd4,#145fae)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #3797ec;outline-offset:3px}
header{height:64px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;border-bottom:1px solid var(--line)}header strong{font-size:16px}header span{font-size:12px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:0 32px 28px}#stage{height:clamp(360px,64vh,650px);position:relative;cursor:grab}#stage:active{cursor:grabbing}canvas{display:block;width:100%;height:100%;touch-action:none}.tools{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding:18px 0}.group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}select{height:34px;border:1px solid var(--line);border-radius:7px;padding:0 28px 0 10px;background:var(--panel);color:var(--ink);font-size:13px}.track{display:flex;align-items:center;gap:12px;flex:1;margin:0 20px;min-width:160px}.track input{width:100%;accent-color:#228be6}output{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}footer{display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px;line-height:1.6;margin-top:4px}#status{min-height:20px}@media(max-height:800px){#stage{height:55vh;min-height:330px}.tools{padding:12px 0}}
</style></head><body><header><strong>造价智算</strong><span>精细模型 · v1.2.0</span></header><main>
<div id="stage"></div>
<section class="tools" aria-label="动效控制"><div class="group"><button class="btn btn-primary" id="loop">组装循环</button><button class="btn" id="explode">打散</button><button class="btn" id="assemble">组合</button><button class="btn btn-ghost" id="pause">暂停</button></div><div class="group"><label>组合<select id="layout"><option value="horizontal">横式 · 造价智算</option><option value="vertical">竖式 · 造价智算</option><option value="icon">仅图形</option></select></label><button class="btn btn-ghost" id="home">默认视角</button></div></section>
<section class="tools" aria-label="部件控制"><div class="group"><label>部件<select id="part"><option value="0">底部横梁</option><option value="1">下阶方块</option><option value="2" selected>中间方块</option><option value="3">上阶方块</option><option value="4">顶部横梁</option></select></label><label>转轴<select id="axis"><option value="x">X 轴</option><option value="y" selected>Y 轴</option><option value="z">Z 轴</option></select></label><button class="btn" id="rotate">旋转选中块</button></div><label class="track">进度<input id="progress" type="range" min="0" max="10" step="0.01" value="0"><output id="time">0.0 / 10.0 s</output></label><div class="group"><button class="btn btn-ghost" id="theme">深色背景</button><button class="btn btn-outline" id="download">下载模型</button></div></section>
<footer><span id="status" role="status" aria-live="polite">正在加载…</span><span>拖动观察 · 滚轮缩放 · 点击选择部件</span></footer></main><script>/*__VIEWER__*/</script></body></html>
