<!doctype html><html lang="zh-CN" data-theme="night"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Astra · 夜览候选 Demo</title></head>
<body><header><div><strong>夜览光效</strong><span class="badge badge-outline">Demo 1.0 · 待确认</span></div><div class="join" aria-label="对照模式"><button class="btn btn-sm join-item" data-mode="baseline">当前夜览</button><button class="btn btn-sm join-item btn-primary" data-mode="candidate">候选夜览</button><button class="btn btn-sm join-item" data-mode="day">日间检查</button></div><button id="pause" class="btn btn-sm">暂停动效</button></header>
<main><section id="scene" aria-label="可交互沙盘"><div id="status" role="status">正在加载真实沙盘模型…</div></section><aside class="card"><div class="card-body"><h2>白芯 · 蓝晕 · 暗部层次</h2><p id="mode-description">候选夜览。拖动旋转，滚轮缩放，点击建筑聚焦。</p>
<fieldset id="tuning"><label>建筑层次 <output id="shell-value">100%</output><input class="range range-primary range-xs" type="range" aria-label="建筑层次" id="shell" min="50" max="160" value="100"></label><label>灯芯亮度 <output id="core-value">100%</output><input class="range range-primary range-xs" type="range" aria-label="灯芯亮度" id="core" min="25" max="160" value="100"></label><label>柔光强度 <output id="halo-value">100%</output><input class="range range-primary range-xs" type="range" aria-label="柔光强度" id="halo" min="0" max="160" value="100"></label><label>外围窗光 <output id="context-value">100%</output><input class="range range-primary range-xs" type="range" aria-label="外围窗光" id="context" min="0" max="160" value="100"></label></fieldset>
<div class="divider"></div><div class="views"><button class="btn btn-sm" data-view="overview">全景</button><button class="btn btn-sm" data-view="tanks">储罐近景</button><button class="btn btn-sm" data-view="pipes">管道近景</button><button class="btn btn-sm" data-view="screen">大屏近景</button></div><button id="reset" class="btn btn-sm btn-ghost">恢复候选参数</button><p class="note">独立视觉样板，不写入正式参数。当前夜览按建筑明暗 45%、辉光 110% 对照。日间检查可切换候选开关核验。</p><label class="day-check"><input id="day-candidate" type="checkbox" class="toggle toggle-primary toggle-sm" checked>日间保留候选开关</label><small id="fps">正在加载</small></div></aside></main><script type="module" src="./main.mjs"></script></body></html>
