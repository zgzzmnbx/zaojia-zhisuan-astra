<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>造价智算 · 包裹传送带 Demo</title></head><body>
<header><div><strong>数据包裹 · 传送带</strong><span class="badge badge-outline">Demo 1.0.4 · 待确认</span></div><div class="join"><button id="overview" class="btn btn-sm join-item">沙盘全景</button><button id="closeup" class="btn btn-sm join-item">运输近景</button><button id="first" class="btn btn-sm join-item" aria-pressed="false">包裹第一视角</button><button id="model" class="btn btn-sm join-item">模型特写</button></div><button id="pause" class="btn btn-sm btn-primary">暂停演示</button></header>
<main><section id="scene" aria-label="包裹传送带三维演示"><div id="status" role="status">正在加载模型…</div></section><aside class="card"><div class="card-body"><div class="eyebrow">当前演示目的地</div><h2 id="destination">清单导入</h2><p id="phase">收件口停靠 · 演示</p><div id="stations"></div><div class="divider"></div><label>播放速度 <output id="speed-value">1×</output><input id="speed" aria-label="播放速度" class="range range-primary range-xs" type="range" min="0.25" max="2" step="0.25" value="1"></label><label>动画时间 <output id="time">0 秒</output><input id="scrub" aria-label="动画时间" class="range range-primary range-xs" type="range" min="0" max="60" step="0.1" value="0"></label><label class="check"><input id="follow" type="checkbox" class="toggle toggle-primary toggle-sm">跟随包裹视角</label><label class="check"><input id="show" type="checkbox" class="toggle toggle-primary toggle-sm" checked>显示传送带方案</label><button id="restart" class="btn btn-sm btn-ghost">从第一站重播</button><div class="divider"></div><label class="weather-label">天气<select id="weather" aria-label="天气" class="select select-sm"><option value="clear">晴朗</option><option value="rain">雨</option><option value="snow">雪</option></select></label><label>雨雪强度 <output id="weather-value">100%</output><input id="weather-strength" aria-label="雨雪强度" class="range range-primary range-xs" type="range" min="0.2" max="1" step="0.1" value="1"></label><label class="check"><input id="sun" type="checkbox" class="toggle toggle-primary toggle-sm" checked>太阳</label><label>太阳亮度 <output id="sun-value">80%</output><input id="sun-strength" aria-label="太阳亮度" class="range range-primary range-xs" type="range" min="0" max="1.5" step="0.1" value="0.8"></label><p class="note">浅色玻璃传送带与原版半透明信息管并行，管内光点持续传递。雨雪随演示暂停；第一视角自动抬升避障。点击站点可暂停查看收件过程。演示顺序不代表业务依赖；确认后再接入真实任务事件。</p><small id="fps">正在加载</small></div></aside></main><script type="module" src="./main.mjs"></script></body></html>
