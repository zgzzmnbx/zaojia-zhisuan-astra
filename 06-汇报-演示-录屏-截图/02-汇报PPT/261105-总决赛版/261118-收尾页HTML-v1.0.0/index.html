<!doctype html>
<html lang="zh-CN">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>造价智算 · 三版收尾页</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#101722;color:#dce7f1;display:grid;grid-template-rows:64px minmax(0,1fr)}header{display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:20px;border-bottom:1px solid #ffffff15}h1{font-size:16px;font-weight:500;margin:0}nav{display:flex;gap:8px}button,a{font:inherit;font-size:14px;color:#c6d8e7;background:transparent;border:1px solid transparent;border-radius:5px;padding:10px 18px;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#e5f2ff;color:#102438}button:hover,a:hover{border-color:#65809b}button:focus-visible,a:focus-visible{outline:2px solid #69c9ff;outline-offset:2px}iframe{width:100%;height:100%;border:0;display:block;background:#030a15}@media(max-width:780px){header{padding:0 8px;gap:8px}h1{display:none}button,a{padding:9px;font-size:12px}}
</style>
<header><h1>造价智算 · 展示收尾</h1><nav aria-label="选择设计版本"><button type="button" aria-pressed="true" data-file="01-星轨汇聚.html">星轨汇聚</button><button type="button" aria-pressed="false" data-file="02-光构未来.html">光构未来</button><button type="button" aria-pressed="false" data-file="03-第一公里.html">第一公里</button></nav><a id="standalone" href="01-星轨汇聚.html" target="_blank" rel="noopener">独立打开</a></header>
<iframe id="preview" src="01-星轨汇聚.html?embed=1" title="造价智算收尾页预览" allow="fullscreen"></iframe>
<script>
const frame=document.getElementById('preview'),buttons=[...document.querySelectorAll('button[data-file]')],link=document.getElementById('standalone');
function select(button){if(frame.getAttribute("src")===button.dataset.file+"?embed=1")return;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));frame.src=button.dataset.file+'?embed=1';link.href=button.dataset.file;try{localStorage.setItem('zsuan-closing-choice',button.dataset.file)}catch{}}
buttons.forEach(button=>button.addEventListener('click',()=>select(button)));
try{const saved=localStorage.getItem('zsuan-closing-choice'),match=buttons.find(b=>b.dataset.file===saved);if(match)select(match)}catch{}
// Same-origin deployment: stop rendering if the parent hides the frame.
const send=visible=>{if(/^https?:$/.test(location.protocol))frame.contentWindow.postMessage({channel:'zsuan-closing',action:'set-visible',visible},location.origin)};
const observer=new IntersectionObserver(entries=>send(entries[0].isIntersecting&&!document.hidden));observer.observe(frame);
document.addEventListener('visibilitychange',()=>send(!document.hidden));
frame.addEventListener('load',()=>send(!document.hidden));
</script>
</html>
